name: Auth Service Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "FIAP-DevOps-Fase-02/services/auth-service/**"
      - ".github/workflows/auth-pipeline.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-security:
    name: Build and Security Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FIAP-DevOps-Fase-02/services/auth-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: true
          cache-dependency-path: FIAP-DevOps-Fase-02/services/auth-service/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Gosec
        run: |
          "$(go env GOPATH)/bin/gosec" ./...

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: FIAP-DevOps-Fase-02/services/auth-service
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Build application
        run: CGO_ENABLED=0 GOOS=linux go build -o auth-service .

      - name: Build Docker image
        run: |
          docker build \
            -t auth-image:${{ github.sha }} \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: auth-image:${{ github.sha }}
          scan-type: image
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::854469103470:role/GitHubActionsAuthECRRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: auth-image
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag auth-image:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}