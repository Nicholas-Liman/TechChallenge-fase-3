name: "Python Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - "FIAP-DevOps-Fase-02/services/**/*.py"
      - "FIAP-DevOps-Fase-02/services/**/requirements.txt"
      - ".github/workflows/py-pipeline.yaml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Install service dependencies
        run: |
          for service in flag-service targeting-service analytics-service; do
            pip install -r "FIAP-DevOps-Fase-02/services/$service/requirements.txt"
          done

      - name: Analyze Python code with Pylint
        run: |
          pylint $(find FIAP-DevOps-Fase-02/services \
            -type f -name "*.py" \
            ! -path "*/.venv/*")