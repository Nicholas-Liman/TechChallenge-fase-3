
name: Flag Service Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "FIAP-DevOps-Fase-02/services/flag-service/**"
      - ".github/workflows/flag-service-pipeline.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-security:
    name: Build and Security Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FIAP-DevOps-Fase-02/services/flag-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: FIAP-DevOps-Fase-02/services/flag-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run Bandit
        run: bandit -r . -ll

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: FIAP-DevOps-Fase-02/services/flag-service
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Build Docker image
        run: docker build -t flag-image:${{ github.sha }} .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: flag-image:${{ github.sha }}
          scan-type: image
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::854469103470:role/GitHubActionsAuthECRRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: flag-image
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag flag-image:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}