name: Analytics Service Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "FIAP-DevOps-Fase-02/services/analytics-service/**"
      - ".github/workflows/analytics-service-pipeline.yaml"

  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-security:
    name: Build, Security and ECR
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FIAP-DevOps-Fase-02/services/analytics-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: FIAP-DevOps-Fase-02/services/analytics-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Check dependencies
        run: pip check

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run Bandit
        run: bandit -r . -ll

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: FIAP-DevOps-Fase-02/services/analytics-service
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Build Docker image
        run: docker build -t analytics-image:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: analytics-image:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::854469103470:role/GitHubActionsAuthECRRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: analytics-image
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag analytics-image:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

      - name: Update GitOps manifest
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd "$GITHUB_WORKSPACE"

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("k8s/08-analytics-service.yaml")
          content = manifest.read_text()

          pattern = (
              r"(^\s*image:\s*"
              r"854469103470\.dkr\.ecr\.us-east-1\.amazonaws\.com/"
              r"analytics-image:)[^\s]+"
          )

          updated, count = re.subn(
              pattern,
              lambda match: match.group(1) + os.environ["IMAGE_TAG"],
              content,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit(
                  f"Esperada exatamente uma imagem analytics-image; encontradas: {count}"
              )

          manifest.write_text(updated)

          print(
              "Manifesto atualizado para: "
              "854469103470.dkr.ecr.us-east-1.amazonaws.com/"
              f"analytics-image:{os.environ['IMAGE_TAG']}"
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/08-analytics-service.yaml

          if git diff --cached --quiet; then
            echo "Manifesto já está atualizado."
          else
            git commit -m "deploy(analytics): update image to ${IMAGE_TAG}"
            git push
          fi
