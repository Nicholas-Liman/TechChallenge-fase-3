# Secret: credenciais e connection strings dos recursos na AWS.
# Os valores ficam em "data" codificados em base64 (base64 NÃO é criptografia, só codificação).
# Para gerar um valor:      echo -n 'texto' | base64 -w0
# Para conferir um valor:   echo 'valor-base64' | base64 -d
# RDS: sslmode=require porque o Postgres 16 do RDS recusa conexão sem SSL.
# ElastiCache Serverless: rediss:// (com dois "s") porque a criptografia em trânsito é obrigatória.
# Credenciais AWS (SQS/DynamoDB) NÃO ficam aqui: o evaluation e o analytics usam IRSA (ServiceAccount).
apiVersion: v1
kind: Secret
metadata:
  name: mysecret
  namespace: auth
type: Opaque
data:
  # admin-secreto-123
  MASTER_KEY: YWRtaW4tc2VjcmV0by0xMjM=
  # postgres://auth:12345678@auth-service-db.cwlgw4e8uhwn.us-east-1.rds.amazonaws.com:5432/auth_db?sslmode=require
  DATABASE_URL: cG9zdGdyZXM6Ly9hdXRoOjEyMzQ1Njc4QGF1dGgtc2VydmljZS1kYi5jd2xndzRlOHVod24udXMtZWFzdC0xLnJkcy5hbWF6b25hd3MuY29tOjU0MzIvYXV0aF9kYj9zc2xtb2RlPXJlcXVpcmU=

